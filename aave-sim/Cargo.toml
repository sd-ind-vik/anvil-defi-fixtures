[package]
name    = "anvil-simulator"
version = "0.1.0"
edition = "2021"

[lib]
name = "aave_sim"
path = "src/lib.rs"

[[bin]]
name = "anvil-simulator"
path = "src/main.rs"

[dependencies]
alloy          = { version = "2",   features = ["full"] }
testcontainers = { version = "0.23" }
tokio          = { version = "1", features = ["full"] }
eyre           = "0.6"
futures        = "0.3"
